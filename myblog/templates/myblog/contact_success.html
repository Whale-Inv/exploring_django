{% extends 'myblog/base.html' %}

{% block content %}
<div class="container mt-5 text-center">
    <div class="alert alert-success" role="alert">
        <h4 class="alert-heading">Сообщение отправлено!</h4>
        <p>Спасибо, <strong>{{name}}</strong>! Ваше сообщение получено.</p>
        <hr>
        <p class="mb-0">
            Мы свяжемся с вами по телефону <strong>{{phone}}</strong> в ближайшее время.
        </p>
    </div>
    
    <div class="mt-4">
        <a href="{% url 'myblog:post_list' %}" class="btn btn-primary btn-lg">
            <i class="fas fa-home me-2"></i>Вернуться на главную
        </a>
        
        <a href="{% url 'myblog:contacts' %}" class="btn btn-outline-secondary btn-lg ms-3">
            <i class="fas fa-envelope me-2"></i>Отправить еще одно сообщение
        </a>
    </div>
</div>
{% endblock %}
