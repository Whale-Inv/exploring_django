{% extends 'myblog/base.html' %}
{% load static %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text">Вы действительно хотите удалить пост <em>{{ object.title }}</em>?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <div class="card-footer d-flex gap-2">
                        <button type="submit" class="btn btn-danger w-50">
                            Удалить
                        </button>
                        <a class="btn btn-primary w-50" href="{% url 'myblog:post_list' %}" role="button">Отменить</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
