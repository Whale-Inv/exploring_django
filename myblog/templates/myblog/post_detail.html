{% extends 'myblog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ object.image | media_filter }}">
                    <div class="card-body"><p class="card-text">Заголовок: {{ object.title }}</p>
                        <p class="card-text">Содержимое: {{ object.content }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a href="{% url 'myblog:post_list' %}" class="btn btn-secondary"
                                   tabindex="-1" role="button" aria-disabled="false">Назад</a>
                            </div>
                            <small class="text-body-secondary">{{ object.views_count }} просмотров</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
