{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ object.image | media_filter }}">
                    <div class="card-body"><p class="card-text">Наименование: {{ object.product_name }}</p>
                        <p class="card-text">Описание: {{ object.description|bullet_list }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary"
                                   tabindex="-1" role="button" aria-disabled="false">Назад</a>
                            </div>
                            <div class="btn-group">
                                <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-secondary"
                                   tabindex="-1" role="button" aria-disabled="false">Редактировать</a>
                            </div>
                            <div class="btn-group">
                                <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-danger"
                                   tabindex="-1" role="button" aria-disabled="false">Удалить</a>
                            </div>
                            <small class="text-body-secondary">{{ object.price|price_with_currency }}</small></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
